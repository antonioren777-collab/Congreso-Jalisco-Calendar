name: Actualizar calendario Congreso Jalisco

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar calendario
        run: python scraper.py

name: Publicar cambios
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    if [ -f calendario.ics ]; then
      git add calendario.ics

      if git diff --cached --quiet; then
        echo "El calendario no tuvo cambios."
      else
        git commit -m "Actualizar calendario"
        git push
      fi
    else
      echo "No existe calendario.ics. No hay eventos que publicar."
    fi
